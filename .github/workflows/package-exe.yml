name: Package Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream release tag / jar version'
        required: true
        default: '2.0.13'

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download official jar from upstream release
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          Invoke-WebRequest -Uri "https://github.com/InvertGeek/mixfilecli/releases/download/$v/mixfile-cli-$v.jar" -OutFile "mixfile-cli-$v.jar"
          $jar = Get-Item "mixfile-cli-$v.jar"
          if ($jar.Length -lt 10MB) { throw "jar download failed (size $($jar.Length))" }
          $jar | Format-List Name,Length

      - name: Set up JDK 21 (for jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Package app-image with jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path input -Force | Out-Null
          Move-Item "mixfile-cli-${{ inputs.version }}.jar" "input\mixfile-cli.jar"
          jpackage `
            --type app-image `
            --dest output `
            --input input `
            --name MixFile `
            --main-jar mixfile-cli.jar `
            --app-version "${{ inputs.version }}" `
            --vendor "InvertGeek" `
            --description "MixFile command line edition for Windows" `
            --win-console `
            --java-options "-XX:+UseZGC" `
            --java-options "-Xmx2g" `
            --java-options "-Dfile.encoding=UTF-8"
          if (-not (Test-Path "output\MixFile\MixFile.exe")) { throw "MixFile.exe not produced" }
          Get-ChildItem "output\MixFile" | Format-Table Name,Length

      - name: Zip bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "output\MixFile" -DestinationPath "MixFile-${{ inputs.version }}-windows-x64.zip"
          Get-Item "MixFile-${{ inputs.version }}-windows-x64.zip" | Format-List Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixFile-${{ inputs.version }}-windows-x64
          path: MixFile-${{ inputs.version }}-windows-x64.zip
          if-no-files-found: error

      - name: Publish to fork release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ inputs.version }}"
          gh release delete "exe-$v" --yes --cleanup-tag --repo $env:GITHUB_REPOSITORY 2>$null
          gh release create "exe-$v" "MixFile-$v-windows-x64.zip" --repo $env:GITHUB_REPOSITORY `
            --title "MixFile CLI $v - Windows exe (bundled JRE)" `
            --notes "官方 mixfile-cli-$v.jar + jpackage 打包，自带 JRE 21 运行时，无需安装 Java。解压后运行 MixFile.exe，浏览器打开 http://localhost:4719"
